<a id="toc0"></a>
<p class="chapter si" id="k1">පුග්ගලපඤ්ඤත්ති-අට්ඨකථා</p>
<p class="gatha1 si" id="k2">නිපුණත්ථං <a class="pinfo P" id="P0.171" title="PTS-Vol 0-Page 171"> ¶ </a><a class="pinfo M" id="M0.25" title="Myanmar-Vol 0-Page 25"> ¶ </a><a class="pinfo V" id="V0.25" title="VRI-Vol 0-Page 25"> ¶ </a> පකරණං, ධාතුභෙදප්පකාසනො;</p>
<p class="gathalast si" id="k3">සත්ථා ධාතුකථං නාම, දෙසයිත්වා සුරාලයෙ.</p>
<p class="gatha1 si" id="k4">අනන්තරං තස්ස ජිනො, පඤ්ඤත්තිභෙදදීපනං;</p>
<p class="gathalast si" id="k5">ආහ පුග්ගලපඤ්ඤත්තිං, යං ලොකෙ අග්ගපුග්ගලො.</p>
<p class="gatha1 si" id="k6">තස්සා සංවණ්ණනොකාසො, යස්මා දානි උපාගතො;</p>
<p class="gathalast si" id="k7">තස්මා නං වණ්ණයිස්සාමි, තං සුණාථ සමාහිතාති.</p>
