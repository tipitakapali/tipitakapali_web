<p class="chapter" id="k1">Yogāvacarasampattidīpanīgāthā</p>
<p class="hangnum" id="k2"><a id="para3"></a><span class="paranum">3</span>. </p>
<p class="gatha1" id="k3"> Jāto yo navame khaṇe sutadharo sīlena suddhindriyo saṃsāraṃ ayato bhavakkayakaraṃ disvā sivaṃ khemato,</p>
<p class="gathalast" id="k4">Taṃ sampāpakamaggadesakamuniṃ sampūjayanto tato uddhānussatibhāvanādikamato sampādaye taṃ sivaṃ.</p>
