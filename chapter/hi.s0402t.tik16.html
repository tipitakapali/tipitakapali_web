<p class="bodytext hi" id="k2"><a id="para191"></a><a id="para192"></a><a id="para193"></a><a id="para194"></a><a id="para195"></a><a id="para196"></a><a id="para197"></a><a id="para198"></a><a id="para199"></a><a id="para200"></a><a id="para191-200"></a><span class="paranum hi">१९१-२००</span>.  दुक्खस्स वड्ढि एतेसन्ति <b class="bld hi">दुक्खवड्ढिका</b>. ये हि दुक्खं वड्ढेन्ति, पुनप्पुनं उप्पादेन्ति, दुक्खस्स वड्ढि तेसं अत्थीति एवं वुत्तं. <b class="bld hi">सुखवड्ढिका</b>ति एत्थापि एसेव नयो.</p>
