<p class="chapter hi" id="k1">कियादयो</p>
<p class="hangnum hi" id="k2"><a id="para118"></a><span class="paranum hi">११८</span>. </p>
<p class="gatha1 hi" id="k3"> की विनिमये चि चये जि जये ञा’वबोधने,</p>
<p class="gathalast hi" id="k4">थव’भित्थवे कम्पने धु (अथो) पु पवने (सिया;)</p>
<p class="hangnum hi" id="k5"><a id="para119"></a><span class="paranum hi">११९</span>. </p>
<p class="gatha1 hi" id="k6">पी तप्पणे मा पमाणे खिपक्खेपे मि हिंसने,</p>
<p class="gatha2 hi" id="k7">मि पमाणे मु बन्धे (च) लु पच्छेदे सि बन्धने</p>
<p class="gathalast hi" id="k8">अस भक्खणे (अथो) गह उपादाने (कियादयो;)</p>
