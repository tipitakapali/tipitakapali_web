<p class="chapter thai" id="k1">อุณฺณาโลมิกนาถ วนฺทนา</p>
<p class="gatha1 thai" id="k2">อุณฺณาโลธิกนาถสฺส <a class="pinfo M" id="M0.71" title="Myanmar-Vol 0-Page 71"> ¶ </a>,</p>
<p class="gatha2 thai" id="k3">อุณฺณาย ภมุกนฺตเร;</p>
<p class="gatha3 thai" id="k4">วชิราวิย โสภนฺติ,</p>
<p class="gathalast thai" id="k5">นิกฺขนฺติ โย สุปณฺฑรา.</p>
<p class="gatha1 thai" id="k6">วชิรคฺฆนกายสฺส <a class="pinfo M" id="M0.72" title="Myanmar-Vol 0-Page 72"> ¶ </a>,</p>
<p class="gatha2 thai" id="k7">นาถสฺส เทหโต สุภา;</p>
<p class="gatha3 thai" id="k8">วชิเรยฺยา นิจฺฉรนฺติ;</p>
<p class="gathalast thai" id="k9">วิชฺชูว คคณนฺตเร.</p>
<p class="gatha1 thai" id="k10">รินินฺทมนฺทหาเสน,</p>
<p class="gatha2 thai" id="k11">ทาาย นิจฺฉรา ปภา;</p>
<p class="gatha3 thai" id="k12">วิปฺผูริสา ทิสาสพฺพา,</p>
<p class="gathalast thai" id="k13">วชิรายนฺติ ปณฺฑรา.</p>
