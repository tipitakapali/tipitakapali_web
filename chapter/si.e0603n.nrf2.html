<a id="toc0"></a>
<p class="chapter si" id="k1">උණ්ණාලොමිකනාථ වන්දනා</p>
<p class="gatha1 si" id="k2">උණ්ණාලොධිකනාථස්ස <a class="pinfo M" id="M0.71" title="Myanmar-Vol 0-Page 71"> ¶ </a>,</p>
<p class="gatha2 si" id="k3">උණ්ණාය භමුකන්තරෙ;</p>
<p class="gatha3 si" id="k4">වජිරාවිය සොභන්ති,</p>
<p class="gathalast si" id="k5">නික්ඛන්ති යො සුපණ්ඩරා.</p>
<p class="gatha1 si" id="k6">වජිරග්ඝනකායස්ස <a class="pinfo M" id="M0.72" title="Myanmar-Vol 0-Page 72"> ¶ </a>,</p>
<p class="gatha2 si" id="k7">නාථස්ස දෙහතො සුභා;</p>
<p class="gatha3 si" id="k8">වජිරෙය්යා නිච්ඡරන්ති;</p>
<p class="gathalast si" id="k9">විජ්ජූව ගගණන්තරෙ.</p>
<p class="gatha1 si" id="k10">රිනින්දමන්දහාසෙන,</p>
<p class="gatha2 si" id="k11">දාඨාය නිච්ඡරා පභා;</p>
<p class="gatha3 si" id="k12">විප්ඵූරිසා දිසාසබ්බා,</p>
<p class="gathalast si" id="k13">වජිරායන්ති පණ්ඩරා.</p>
