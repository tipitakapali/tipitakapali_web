<p class="centered si" id="k1"> නමො තස්ස භගවතො අරහතො සම්මාසම්බුද්ධස්ස</p>
<a id="toc0"></a>
<p class="nikaya si" id="k2">අභිධම්මපිටකෙ</p>
<a id="toc1"></a>
<p class="book si" id="k3">පඤ්චපකරණ-අට්ඨකථා</p>
<a id="toc2"></a>
<p class="chapter si" id="k4">ධාතුකථා-අට්ඨකථා</p>
<p class="gatha1 si" id="k5">අට්ඨාරසහි <a class="pinfo P" id="P0.114" title="PTS-Vol 0-Page 114"> ¶ </a><a class="pinfo M" id="M0.1" title="Myanmar-Vol 0-Page 1"> ¶ </a><a class="pinfo V" id="V0.1" title="VRI-Vol 0-Page 1"> ¶ </a> භෙදෙහි, විභඞ්ගං මාරභඤ්ජනො;</p>
<p class="gathalast si" id="k6">දෙසයිත්වා මහාවීරො, යං තස්සෙව අනන්තරං.</p>
<p class="gatha1 si" id="k7">අදෙසයි ධාතුකථං, ධාතුභෙදප්පකාසනො;</p>
<p class="gathalast si" id="k8">තස්සත්ථං දීපයිස්සාමි, තං සුණාථ සමාහිතාති.</p>
