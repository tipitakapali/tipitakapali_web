<p class="chapter thai" id="k1">๒. อกุสลเปยฺยาลํ</p>
<p class="bodytext thai" id="k2"><a id="para191"></a><a id="para192"></a><a id="para193"></a><a id="para194"></a><a id="para195"></a><a id="para196"></a><a id="para197"></a><a id="para198"></a><a id="para199"></a><a id="para200"></a><a id="para191-200"></a><span class="paranum thai">๑๙๑-๒๐๐</span>. ทุกฺขสฺส วฑฺฒิ เอเตสนฺติ <b class="bld thai">ทุกฺขวฑฺฒิกา</b>. เย หิ ทุกฺขํ วฑฺเฒนฺติ, ปุนปฺปุนํ อุปฺปาเทนฺติ, ทุกฺขสฺส วฑฺฒิ เตสํ อตฺถีติ เอวํ วุตฺตํ. <b class="bld thai">สุขวฑฺฒิกา</b>ติ เอตฺถาปิ เอเสว นโย.</p>
