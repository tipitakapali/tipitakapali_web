<a id="toc0"></a>
<p class="chapter hi" id="k1">पाटिहारियदीपनीगाथा</p>
<p class="hangnum hi" id="k2"><a id="para175"></a><span class="paranum hi">१७५</span>. </p>
<p class="gatha1 hi" id="k3"> ब्रह्मस्स सद्दं करवीकभाणिं,</p>
<p class="gatha2 hi" id="k4">यथिच्छितं सावयितुं समत्थं;</p>
<p class="gatha3 hi" id="k5">सच्चं पियं भूतहितं वदन्तं,</p>
<p class="gathalast hi" id="k6">न पूजये को हि नरो सचेतनो.</p>
<p class="hangnum hi" id="k7"><a id="para176"></a><span class="paranum hi">१७६</span>. </p>
<p class="gatha1 hi" id="k8"> इद्धि च आदेसनानुसासनी,</p>
<p class="gatha2 hi" id="k9">पाटिहीरे भगवा वसी अहु;</p>
<p class="gatha3 hi" id="k10">कत्वान अच्छेरसुपाटिहीरं,</p>
<p class="gathalast hi" id="k11">देसेसि धम्मं अनुकम्पिमं पजं.</p>
