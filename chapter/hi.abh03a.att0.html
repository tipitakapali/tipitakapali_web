<p class="gatha1 hi" id="k5">अट्ठारसहि <a class="pinfo P" id="P0.114" title="PTS-Vol 0-Page 114"> ¶ </a><a class="pinfo M" id="M0.1" title="Myanmar-Vol 0-Page 1"> ¶ </a><a class="pinfo V" id="V0.1" title="VRI-Vol 0-Page 1"> ¶ </a> भेदेहि, विभङ्गं मारभञ्जनो;</p>
<p class="gathalast hi" id="k6">देसयित्वा महावीरो, यं तस्सेव अनन्तरं.</p>
<p class="gatha1 hi" id="k7">अदेसयि धातुकथं, धातुभेदप्पकासनो;</p>
<p class="gathalast hi" id="k8">तस्सत्थं दीपयिस्सामि, तं सुणाथ समाहिताति.</p>
