<p class="chapter si" id="k1">ජුහොත්යා’දයො <a class="pinfo V" id="V0.23" title="VRI-Vol 0-Page 23"> ¶ </a> සද්විභාවලුත්තවිකරණා.</p>
<p class="hangnum si" id="k2"><a id="para100"></a><span class="paranum si">100</span>. </p>
<p class="gatha1 si" id="k3"> හූ දානෙ’(පි ච) ආදානෙ හව්යදානෙ (ච වත්තතෙ,)</p>
<p class="gathalast si" id="k4">හා චාගෙ කමු යාත්රායං දා දානෙ ධා (ච) ධාරණෙ;</p>
<p class="centered si" id="k5">අවිකරණභූවාදයො සමත්තා.</p>
