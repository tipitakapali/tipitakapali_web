<p class="chapter hi" id="k1">२. अकुसलपेय्यालं</p>
<p class="bodytext hi" id="k2"><a id="para191"></a><a id="para192"></a><a id="para193"></a><a id="para194"></a><a id="para195"></a><a id="para196"></a><a id="para197"></a><a id="para198"></a><a id="para199"></a><a id="para200"></a><a id="para191-200"></a><span class="paranum hi">१९१-२००</span>. <b class="bld hi">सावज्जा</b>ति <a class="pinfo V" id="V2.67" title="VRI-Vol 2-Page 67"> ¶ </a> सदोसा. <b class="bld hi">अनवज्जा</b>ति निद्दोसा. <b class="bld hi">दुक्खुद्रया</b>ति दुक्खवड्ढिका. <b class="bld hi">सुखुद्रिया</b>ति सुखवड्ढिका. <b class="bld hi">सब्याबज्झा</b>ति सदुक्खा. <b class="bld hi">अब्याबज्झा</b>ति निद्दुक्खा. एत्तावता वट्टविवट्टमेव कथितं.</p>
<p class="centered hi" id="k3">अकुसलपेय्यालं निट्ठितं.</p>
