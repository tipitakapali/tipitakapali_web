<p class="chapter si" id="k1">දුතියගාථාසඞ්ගණිකවණ්ණනා</p>
<p class="bodytext si" id="k2"><a id="para359"></a><span class="paranum si">359</span>.  මන්තග්ගහණන්ති <a class="pinfo V" id="V3.446" title="VRI-Vol 3-Page 446"> ¶ </a> අඤ්ඤමඤ්ඤං සංසන්දනං. අනු අනු සන්ධානං අනුසන්ධිතන්ති භාවසාධනො <b class="bld si">අනුසන්ධිත</b>සද්දොති ආහ <b class="bld si">‘‘අනුසන්ධිතන්ති කථානුසන්ධී’’</b>ති.</p>
