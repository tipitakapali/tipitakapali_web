<a id="toc0"></a>
<p class="chapter thai" id="k1">ปุคฺคลปฺตฺติ-อฏฺกถา</p>
<p class="gatha1 thai" id="k2">นิปุณตฺถํ <a class="pinfo P" id="P0.171" title="PTS-Vol 0-Page 171"> ¶ </a><a class="pinfo M" id="M0.25" title="Myanmar-Vol 0-Page 25"> ¶ </a><a class="pinfo V" id="V0.25" title="VRI-Vol 0-Page 25"> ¶ </a> ปกรณํ, ธาตุเภทปฺปกาสโน;</p>
<p class="gathalast thai" id="k3">สตฺถา ธาตุกถํ นาม, เทสยิตฺวา สุราลเย.</p>
<p class="gatha1 thai" id="k4">อนนฺตรํ ตสฺส ชิโน, ปฺตฺติเภททีปนํ;</p>
<p class="gathalast thai" id="k5">อาห ปุคฺคลปฺตฺตึ, ยํ โลเก อคฺคปุคฺคโล.</p>
<p class="gatha1 thai" id="k6">ตสฺสา สํวณฺณโนกาโส, ยสฺมา ทานิ อุปาคโต;</p>
<p class="gathalast thai" id="k7">ตสฺมา นํ วณฺณยิสฺสามิ, ตํ สุณาถ สมาหิตาติ.</p>
