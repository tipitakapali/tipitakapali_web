<p class="chapter si" id="k1">උපොසථාදිපුච්ඡාවිස්සජ්ජනාවණ්ණනා</p>
<p class="bodytext si" id="k2"><a id="para332"></a><span class="paranum si">332</span>.  උපොසථාදිපුච්ඡාසු <a class="pinfo V" id="V2.276" title="VRI-Vol 2-Page 276"> ¶ </a><b class="bld si">පවාරණගාථා</b>ති දිට්ඨාදීහි තීහි ඨානෙහි පවාරණාවාචා එව. එවං වුත්තානං පන ඡන්දොවිචිතිලක්ඛණෙන වුත්තජාතිභෙදා ගාථා.</p>
<p class="centered si" id="k3">ඡක්කවාරාදිවණ්ණනා නිට්ඨිතා.</p>
<p class="centered si" id="k4">මහාවග්ගවණ්ණනානයො නිට්ඨිතො.</p>
