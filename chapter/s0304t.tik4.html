<p class="chapter" id="k1">5. Sāmaṇḍakasaṃyuttavaṇṇanā</p>
<p class="bodytext" id="k2"><a id="para330"></a><a id="para331"></a><a id="para330-331"></a><span class="paranum">330-331</span>. <b class="bld">Imināva</b><a class="pinfo V" id="V2.81" title="VRI-Vol 2-Page 81"> ¶ </a><b class="bld">nayenā</b>ti yo jambukhādakasaṃyutte atthanayo, imināva nayena. Iminā hi dve saṃyuttāni pāḷito atthato ca aññamaññaṃ sadisānevāti dasseti.</p>
<p class="centered" id="k3">Sāmaṇḍakasaṃyuttavaṇṇanā niṭṭhitā.</p>
