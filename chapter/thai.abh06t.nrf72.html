<a id="toc0"></a>
<p class="chapter thai" id="k1">คนฺถารมฺภกถา</p>
<p class="hangnum thai" id="k2"><a id="para1"></a><span class="paranum thai">๑</span>. </p>
<p class="gatha1 thai" id="k3"> นมสฺสิตฺวา <a class="pinfo M" id="M0.1" title="Myanmar-Vol 0-Page 1"> ¶ </a><a class="pinfo V" id="V0.1" title="VRI-Vol 0-Page 1"> ¶ </a> ติโลกคฺคํ, เยฺยสาครปารคุํ;</p>
<p class="gathalast thai" id="k4">ภวาภาวกรํ ธมฺมํ, คณฺจ คุณสาครํ.</p>
<p class="hangnum thai" id="k5"><a id="para2"></a><span class="paranum thai">๒</span>. </p>
<p class="gatha1 thai" id="k6"> นิสฺสาย ปุพฺพาจริยมตํ อตฺถาวิโรธินํ;</p>
<p class="gathalast thai" id="k7">วกฺขามิ สจฺจสงฺเขปํ, หิตํ การกโยคินํ.</p>
