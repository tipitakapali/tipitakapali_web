<p class="title si" id="k2">32-43. ඔඝාදිදුකානි</p>
<p class="bodytext si" id="k3"><a id="para1"></a><span class="paranum si">1</span>.  ඔඝං <a class="pinfo T" id="T3.347" title="Thai-Vol 3-Page 347"> ¶ </a><a class="pinfo V" id="V3.365" title="VRI-Vol 3-Page 365"> ¶ </a> ධම්මං පටිච්ච ඔඝො ධම්මො උප්පජ්ජති හෙතුපච්චයා…පෙ….</p>
<p class="bodytext si" id="k4"><a id="para2"></a><span class="paranum si">2</span>.  යොගං ධම්මං පටිච්ච යොගො ධම්මො උප්පජ්ජති හෙතුපච්චයා…පෙ… (ද්වෙපි ගොච්ඡකා ආසවගොච්ඡකසදිසා නින්නානාකරණා).</p>
<p class="centered si" id="k5">ඔඝයොගගොච්ඡකං නිට්ඨිතං.</p>
