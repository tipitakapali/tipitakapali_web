<p class="chapter si" id="k1">2. අකුසලපෙය්යාලං</p>
<p class="bodytext si" id="k2"><a id="para191"></a><a id="para192"></a><a id="para193"></a><a id="para194"></a><a id="para195"></a><a id="para196"></a><a id="para197"></a><a id="para198"></a><a id="para199"></a><a id="para200"></a><a id="para191-200"></a><span class="paranum si">191-200</span>.  දුක්ඛස්ස වඩ්ඪි එතෙසන්ති <b class="bld si">දුක්ඛවඩ්ඪිකා</b>. යෙ හි දුක්ඛං වඩ්ඪෙන්ති, පුනප්පුනං උප්පාදෙන්ති, දුක්ඛස්ස වඩ්ඪි තෙසං අත්ථීති එවං වුත්තං. <b class="bld si">සුඛවඩ්ඪිකා</b>ති එත්ථාපි එසෙව නයො.</p>
