<a id="toc0"></a>
<p class="chapter si" id="k1">රුධාදයො</p>
<p class="hangnum si" id="k2"><a id="para101"></a><span class="paranum si">101</span>. </p>
<p class="gatha1 si" id="k3"> රුධි ආවරණෙ මුච මොචනෙ රිච රෙචනෙ,</p>
<p class="gathalast si" id="k4">සිච සෙකෙ යුජ යොගෙ භුජ පාලනභොජනෙ;</p>
<p class="hangnum si" id="k5"><a id="para102"></a><span class="paranum si">102</span>. </p>
<p class="gatha1 si" id="k6"> කතිච්ඡෙදෙ ඡිදි ද්වෙධාකරණෙ භිද විදාරණෙ</p>
<p class="gatha2 si" id="k7">විද ලාභෙ ලුපච්ඡෙදෙ විනාසෙ ලිපලිම්පනෙ</p>
<p class="gathalast si" id="k8">පිස සංචුණ්ණනෙ හිසි විහිංසායං (රුධාදයො;)</p>
