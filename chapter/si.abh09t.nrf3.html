<p class="chapter si" id="k1">4. පුග්ගලපඤ්ඤත්තිමාතිකා</p>
<p class="bodytext si" id="k2">ඡ පඤ්ඤත්තියො (පු. ප. මාතිකා 1) – ඛන්ධපඤ්ඤත්ති ආයතනපඤ්ඤත්ති ධාතුපඤ්ඤත්ති සච්චපඤ්ඤත්ති ඉන්ද්රියපඤ්ඤත්ති පුග්ගලපඤ්ඤත්තීති.</p>
<p class="centered si" id="k3">පුග්ගලපඤ්ඤත්තිමාතිකා නිට්ඨිතා.</p>
