<p class="chapter my" id="k1">ကိယာဒယော</p>
<p class="hangnum my" id="k2"><a id="para118"></a><span class="paranum my">၁၁၈</span>။ </p>
<p class="gatha1 my" id="k3"> ကီ ဝိနိမယေ စိ စယေ ဇိ ဇယေ ဉာ’ဝဗောဓနေ၊</p>
<p class="gathalast my" id="k4">ထဝ’ဘိတ္ထဝေ ကမ္ပနေ ဓု (အထော) ပု ပဝနေ (သိယာ၊)</p>
<p class="hangnum my" id="k5"><a id="para119"></a><span class="paranum my">၁၁၉</span>။ </p>
<p class="gatha1 my" id="k6">ပီ တပ္ပဏေ မာ ပမာဏေ ခိပက္ခေပေ မိ ဟိံသနေ၊</p>
<p class="gatha2 my" id="k7">မိ ပမာဏေ မု ဗန္ဓေ (စ) လု ပစ္ဆေဒေ သိ ဗန္ဓနေ</p>
<p class="gathalast my" id="k8">အသ ဘက္ခဏေ (အထော) ဂဟ ဥပါဒါနေ (ကိယာဒယော၊)</p>
