<p class="chapter hi" id="k1">दासक कण्ड</p>
<p class="hangnum hi" id="k2"><a id="para292"></a><span class="paranum hi">२९२</span>. </p>
<p class="gatha1 hi" id="k3"> अन्तोजातो <a class="pinfo M" id="M0.176" title="Myanmar-Vol 0-Page 176"> ¶ </a> धनक्कीतो, दासब्योपगतो सयं;</p>
<p class="gathalast hi" id="k4">दासाकरमरानीतो-च्चेवं ते चतुधा सियुं.</p>
<p class="hangnum hi" id="k5"><a id="para293"></a><span class="paranum hi">२९३</span>. </p>
<p class="gatha1 hi" id="k6"> पुब्बुट्ठा पच्छानिपाती, दिन्नस्स आदायीपि च;</p>
<p class="gathalast hi" id="k7">सुकतकम्मकरो च, कित्तिवण्णहरोपि च.</p>
<p class="hangnum hi" id="k8"><a id="para294"></a><span class="paranum hi">२९४</span>. </p>
<p class="gatha1 hi" id="k9"> दासा ०.०१७७ पञ्चेव चोरय्य-सखाञात्यत्तसादिसा;</p>
<p class="gathalast hi" id="k10">तथा विञ्ञूहि विञ्ञेय्या, मित्तदारा च बन्धवा.</p>
