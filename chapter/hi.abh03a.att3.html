<p class="chapter hi" id="k1">पुग्गलपञ्ञत्ति-अट्ठकथा</p>
<p class="gatha1 hi" id="k2">निपुणत्थं <a class="pinfo P" id="P0.171" title="PTS-Vol 0-Page 171"> ¶ </a><a class="pinfo M" id="M0.25" title="Myanmar-Vol 0-Page 25"> ¶ </a><a class="pinfo V" id="V0.25" title="VRI-Vol 0-Page 25"> ¶ </a> पकरणं, धातुभेदप्पकासनो;</p>
<p class="gathalast hi" id="k3">सत्था धातुकथं नाम, देसयित्वा सुरालये.</p>
<p class="gatha1 hi" id="k4">अनन्तरं तस्स जिनो, पञ्ञत्तिभेददीपनं;</p>
<p class="gathalast hi" id="k5">आह पुग्गलपञ्ञत्तिं, यं लोके अग्गपुग्गलो.</p>
<p class="gatha1 hi" id="k6">तस्सा संवण्णनोकासो, यस्मा दानि उपागतो;</p>
<p class="gathalast hi" id="k7">तस्मा नं वण्णयिस्सामि, तं सुणाथ समाहिताति.</p>
