<p class="chapter my" id="k1">ဥပေါသထာဒိပုစ္ဆာဝိဿဇ္ဇနာဝဏ္ဏနာ</p>
<p class="bodytext my" id="k2"><a id="para332"></a><span class="paranum my">၃၃၂</span>။ ဥပေါသထာဒိပုစ္ဆာသု <a class="pinfo V" id="V2.276" title="VRI-Vol 2-Page 276"> ¶ </a><b class="bld my">ပဝါရဏဂါထာ</b>တိ ဒိဋ္ဌာဒီဟိ တီဟိ ဌာနေဟိ ပဝါရဏာဝါစာ ဧဝ။ ဧဝံ ဝုတ္တာနံ ပန ဆန္ဒောဝိစိတိလက္ခဏေန ဝုတ္တဇာတိဘေဒါ ဂါထာ။</p>
<p class="centered my" id="k3">ဆက္ကဝါရာဒိဝဏ္ဏနာ နိဋ္ဌိတာ။</p>
<p class="centered my" id="k4">မဟာဝဂ္ဂဝဏ္ဏနာနယော နိဋ္ဌိတော။</p>
<a id="toc1"></a>
<p class="title my" id="k5">ပညတ္တိဝဂ္ဂေါ</p>
