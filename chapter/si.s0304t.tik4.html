<p class="chapter si" id="k1">5. සාමණ්ඩකසංයුත්තවණ්ණනා</p>
<p class="bodytext si" id="k2"><a id="para330"></a><a id="para331"></a><a id="para330-331"></a><span class="paranum si">330-331</span>. <b class="bld si">ඉමිනාව</b><a class="pinfo V" id="V2.81" title="VRI-Vol 2-Page 81"> ¶ </a><b class="bld si">නයෙනා</b>ති යො ජම්බුඛාදකසංයුත්තෙ අත්ථනයො, ඉමිනාව නයෙන. ඉමිනා හි ද්වෙ සංයුත්තානි පාළිතො අත්ථතො ච අඤ්ඤමඤ්ඤං සදිසානෙවාති දස්සෙති.</p>
<p class="centered si" id="k3">සාමණ්ඩකසංයුත්තවණ්ණනා නිට්ඨිතා.</p>
