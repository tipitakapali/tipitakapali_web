<p class="chapter thai" id="k1">๖-๗. โอฆโยคโคจฺฉกํ</p>
<a id="toc1"></a>
<p class="title thai" id="k2">๓๒-๔๓. โอฆาทิทุกานิ</p>
<p class="bodytext thai" id="k3"><a id="para1"></a><span class="paranum thai">๑</span>. โอฆํ <a class="pinfo T" id="T3.347" title="Thai-Vol 3-Page 347"> ¶ </a><a class="pinfo V" id="V3.365" title="VRI-Vol 3-Page 365"> ¶ </a> ธมฺมํ ปฏิจฺจ โอโฆ ธมฺโม อุปฺปชฺชติ เหตุปจฺจยา…เป….</p>
<p class="bodytext thai" id="k4"><a id="para2"></a><span class="paranum thai">๒</span>. โยคํ ธมฺมํ ปฏิจฺจ โยโค ธมฺโม อุปฺปชฺชติ เหตุปจฺจยา…เป… (ทฺเวปิ โคจฺฉกา อาสวโคจฺฉกสทิสา นินฺนานากรณา).</p>
<p class="centered thai" id="k5">โอฆโยคโคจฺฉกํ นิฏฺิตํ.</p>
