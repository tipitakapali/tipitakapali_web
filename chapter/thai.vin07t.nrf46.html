<p class="chapter thai" id="k1">อุโปสถาทิปุจฺฉาวิสฺสชฺชนาวณฺณนา</p>
<p class="bodytext thai" id="k2"><a id="para332"></a><span class="paranum thai">๓๓๒</span>. อุโปสถาทิปุจฺฉาสุ <a class="pinfo V" id="V2.276" title="VRI-Vol 2-Page 276"> ¶ </a><b class="bld thai">ปวารณคาถา</b>ติ ทิฏฺาทีหิ ตีหิ าเนหิ ปวารณาวาจา เอว. เอวํ วุตฺตานํ ปน ฉนฺโทวิจิติลกฺขเณน วุตฺตชาติเภทา คาถา.</p>
<p class="centered thai" id="k3">ฉกฺกวาราทิวณฺณนา นิฏฺิตา.</p>
<p class="centered thai" id="k4">มหาวคฺควณฺณนานโย นิฏฺิโต.</p>
