<p class="bodytext thai" id="k2"><a id="para470"></a><span class="paranum thai">๔๗๐</span>. <b class="bld thai">ปุพฺเพ</b><a class="pinfo M" id="M3.490" title="Myanmar-Vol 3-Page 490"> ¶ </a><b class="bld thai">วุตฺตเมวา</b>ติ สหเสยฺยาทิปณฺณตฺติวชฺชํ. <b class="bld thai">อิตร</b>นฺติ สจิตฺตกํ. <b class="bld thai">ภึสาปนาทีนิ กตฺวา</b>ติ ภึสาปนาทินา อาปตฺตึ อาปชฺชิตฺวาติ อธิปฺปาโย.</p>
