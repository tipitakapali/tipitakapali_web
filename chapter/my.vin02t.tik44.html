<p class="bodytext my" id="k2"><a id="para470"></a><span class="paranum my">၄၇၀</span>။ <b class="bld my">ပုဗ္ဗေ</b><a class="pinfo M" id="M3.490" title="Myanmar-Vol 3-Page 490"> ¶ </a><b class="bld my">ဝုတ္တမေဝါ</b>တိ သဟသေယျာဒိပဏ္ဏတ္တိဝဇ္ဇံ။ <b class="bld my">ဣတရ</b>န္တိ သစိတ္တကံ။ <b class="bld my">ဘိံသာပနာဒီနိ ကတွာ</b>တိ ဘိံသာပနာဒိနာ အာပတ္တိံ အာပဇ္ဇိတွာတိ အဓိပ္ပာယော။</p>
