<p class="chapter thai" id="k1">๕. สามณฺฑกสํยุตฺตวณฺณนา</p>
<p class="bodytext thai" id="k2"><a id="para330"></a><a id="para331"></a><a id="para330-331"></a><span class="paranum thai">๓๓๐-๓๓๑</span>. <b class="bld thai">อิมินาว</b><a class="pinfo V" id="V2.81" title="VRI-Vol 2-Page 81"> ¶ </a><b class="bld thai">นเยนา</b>ติ โย ชมฺพุขาทกสํยุตฺเต อตฺถนโย, อิมินาว นเยน. อิมินา หิ ทฺเว สํยุตฺตานิ ปาฬิโต อตฺถโต จ อฺมฺํ สทิสาเนวาติ ทสฺเสติ.</p>
<p class="centered thai" id="k3">สามณฺฑกสํยุตฺตวณฺณนา นิฏฺิตา.</p>
