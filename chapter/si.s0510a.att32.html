<a id="toc1"></a>
<p class="subhead si" id="k2">1-50. ගන්ධධූපියත්ථෙරඅපදානාදිවණ්ණනා</p>
<p class="bodytext si" id="k3">චතුතිංසතිමවග්ගපඤ්චතිංසතිමවග්ගඡත්තිංසතිමවග්ගසත්තතිංසතිමවග්ගඅට්ඨතිංසතිමවග්ගා <a class="pinfo M" id="M2.199" title="Myanmar-Vol 2-Page 199"> ¶ </a><a class="pinfo V" id="V2.195" title="VRI-Vol 2-Page 195"> ¶ </a> උත්තානත්ථායෙව.</p>
<p class="bodytext si" id="k4">එකූනචත්තාලීසමවග්ගෙපි පඨමාපදානාදීනි අට්ඨමාපදානන්තානි උත්තානානෙවාති.</p>
