<p class="chapter thai" id="k1">๒. อกุสลเปยฺยาลํ</p>
<p class="bodytext thai" id="k2"><a id="para191"></a><a id="para192"></a><a id="para193"></a><a id="para194"></a><a id="para195"></a><a id="para196"></a><a id="para197"></a><a id="para198"></a><a id="para199"></a><a id="para200"></a><a id="para191-200"></a><span class="paranum thai">๑๙๑-๒๐๐</span>. <b class="bld thai">สาวชฺชา</b>ติ <a class="pinfo V" id="V2.67" title="VRI-Vol 2-Page 67"> ¶ </a> สโทสา. <b class="bld thai">อนวชฺชา</b>ติ นิทฺโทสา. <b class="bld thai">ทุกฺขุทฺรยา</b>ติ ทุกฺขวฑฺฒิกา. <b class="bld thai">สุขุทฺริยา</b>ติ สุขวฑฺฒิกา. <b class="bld thai">สพฺยาพชฺฌา</b>ติ สทุกฺขา. <b class="bld thai">อพฺยาพชฺฌา</b>ติ นิทฺทุกฺขา. เอตฺตาวตา วฏฺฏวิวฏฺฏเมว กถิตํ.</p>
<p class="centered thai" id="k3">อกุสลเปยฺยาลํ นิฏฺิตํ.</p>
