<p class="chapter si" id="k1">12. වච්ඡගොත්තසංයුත්තවණ්ණනා</p>
<p class="bodytext si" id="k2"><a id="para607"></a><a id="para608"></a><a id="para609"></a><a id="para610"></a><a id="para611"></a><a id="para612"></a><a id="para613"></a><a id="para614"></a><a id="para615"></a><a id="para616"></a><a id="para617"></a><a id="para618"></a><a id="para619"></a><a id="para620"></a><a id="para621"></a><a id="para622"></a><a id="para623"></a><a id="para624"></a><a id="para625"></a><a id="para626"></a><a id="para627"></a><a id="para628"></a><a id="para629"></a><a id="para630"></a><a id="para631"></a><a id="para632"></a><a id="para633"></a><a id="para634"></a><a id="para635"></a><a id="para636"></a><a id="para637"></a><a id="para638"></a><a id="para639"></a><a id="para640"></a><a id="para641"></a><a id="para642"></a><a id="para643"></a><a id="para644"></a><a id="para645"></a><a id="para646"></a><a id="para647"></a><a id="para648"></a><a id="para649"></a><a id="para650"></a><a id="para651"></a><a id="para652"></a><a id="para653"></a><a id="para654"></a><a id="para655"></a><a id="para656"></a><a id="para657"></a><a id="para658"></a><a id="para659"></a><a id="para660"></a><a id="para661"></a><a id="para607-661"></a><span class="paranum si">607-661</span>.  වච්ඡගොත්තසංයුත්තෙ <a class="pinfo M" id="M2.323" title="Myanmar-Vol 2-Page 323"> ¶ </a><a class="pinfo V" id="V2.317" title="VRI-Vol 2-Page 317"> ¶ </a><b class="bld si">අඤ්ඤාණා</b>ති අඤ්ඤාණෙන. එවං සබ්බපදෙසු කරණවසෙනෙව අත්ථො වෙදිතබ්බො. සබ්බානි චෙතානි අඤ්ඤමඤ්ඤවෙවචනානෙවාති. ඉමස්මිඤ්ච පන සංයුත්තෙ එකාදස සුත්තානි පඤ්චපඤ්ඤාස වෙය්යාකරණානීති වෙදිතබ්බානි.</p>
<p class="bodytext si" id="k3">වච්ඡගොත්තසංයුත්තවණ්ණනා නිට්ඨිතා.</p>
