<p class="hangnum thai" id="k2"><a id="para3"></a><span class="paranum thai">๓</span>. </p>
<p class="gatha1 thai" id="k3"> ชาโต โย นวเม ขเณ สุตธโร สีเลน สุทฺธินฺทฺริโย สํสารํ อยโต ภวกฺกยกรํ ทิสฺวา สิวํ เขมโต,</p>
<p class="gathalast thai" id="k4">ตํ สมฺปาปกมคฺคเทสกมุนึ สมฺปูชยนฺโต ตโต อุทฺธานุสฺสติภาวนาทิกมโต สมฺปาทเย ตํ สิวํ.</p>
