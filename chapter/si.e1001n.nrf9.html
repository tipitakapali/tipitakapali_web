<p class="chapter si" id="k1">දාසක කණ්ඩ</p>
<p class="hangnum si" id="k2"><a id="para292"></a><span class="paranum si">292</span>. </p>
<p class="gatha1 si" id="k3"> අන්තොජාතො <a class="pinfo M" id="M0.176" title="Myanmar-Vol 0-Page 176"> ¶ </a> ධනක්කීතො, දාසබ්යොපගතො සයං;</p>
<p class="gathalast si" id="k4">දාසාකරමරානීතො-ච්චෙවං තෙ චතුධා සියුං.</p>
<p class="hangnum si" id="k5"><a id="para293"></a><span class="paranum si">293</span>. </p>
<p class="gatha1 si" id="k6"> පුබ්බුට්ඨා පච්ඡානිපාතී, දින්නස්ස ආදායීපි ච;</p>
<p class="gathalast si" id="k7">සුකතකම්මකරො ච, කිත්තිවණ්ණහරොපි ච.</p>
<p class="hangnum si" id="k8"><a id="para294"></a><span class="paranum si">294</span>. </p>
<p class="gatha1 si" id="k9"> දාසා 0.0177 පඤ්චෙව චොරය්ය-සඛාඤාත්යත්තසාදිසා;</p>
<p class="gathalast si" id="k10">තථා විඤ්ඤූහි විඤ්ඤෙය්යා, මිත්තදාරා ච බන්ධවා.</p>
