<p class="chapter my" id="k1">ယောဂါဝစရသမ္ပတ္တိဒီပနီဂါထာ</p>
<p class="hangnum my" id="k2"><a id="para3"></a><span class="paranum my">၃</span>။ </p>
<p class="gatha1 my" id="k3"> ဇာတော ယော နဝမေ ခဏေ သုတဓရော သီလေန သုဒ္ဓိန္ဒြိယော သံသာရံ အယတော ဘဝက္ကယကရံ ဒိသွာ သိဝံ ခေမတော၊</p>
<p class="gathalast my" id="k4">တံ သမ္ပာပကမဂ္ဂဒေသကမုနိံ သမ္ပူဇယန္တော တတော ဥဒ္ဓါနုဿတိဘာဝနာဒိကမတော သမ္ပာဒယေ တံ သိဝံ။</p>
