<a id="toc0"></a>
<p class="chapter hi" id="k1">उण्णालोमिकनाथ वन्दना</p>
<p class="gatha1 hi" id="k2">उण्णालोधिकनाथस्स <a class="pinfo M" id="M0.71" title="Myanmar-Vol 0-Page 71"> ¶ </a>,</p>
<p class="gatha2 hi" id="k3">उण्णाय भमुकन्तरे;</p>
<p class="gatha3 hi" id="k4">वजिराविय सोभन्ति,</p>
<p class="gathalast hi" id="k5">निक्खन्ति यो सुपण्डरा.</p>
<p class="gatha1 hi" id="k6">वजिरग्घनकायस्स <a class="pinfo M" id="M0.72" title="Myanmar-Vol 0-Page 72"> ¶ </a>,</p>
<p class="gatha2 hi" id="k7">नाथस्स देहतो सुभा;</p>
<p class="gatha3 hi" id="k8">वजिरेय्या निच्छरन्ति;</p>
<p class="gathalast hi" id="k9">विज्जूव गगणन्तरे.</p>
<p class="gatha1 hi" id="k10">रिनिन्दमन्दहासेन,</p>
<p class="gatha2 hi" id="k11">दाठाय निच्छरा पभा;</p>
<p class="gatha3 hi" id="k12">विप्फूरिसा दिसासब्बा,</p>
<p class="gathalast hi" id="k13">वजिरायन्ति पण्डरा.</p>
