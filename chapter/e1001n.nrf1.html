<p class="chapter" id="k1">Ratanattayapaṇāma</p>
<p class="hangnum" id="k2"><a id="para1"></a><span class="paranum">1</span>. </p>
<p class="gatha1" id="k3"> Mahākavivaraṃ <a class="pinfo M" id="M0.1" title="Myanmar-Vol 0-Page 1"> ¶ </a> buddhaṃ, dhammañca tena sevitaṃ;</p>
<p class="gathalast" id="k4">Saṅghaṃ niraṅgaṇañcāpi, vandāmi sirasā daraṃ.</p>
<p class="hangnum" id="k5"><a id="para2"></a><span class="paranum">2</span>. </p>
<p class="gatha1" id="k6"> Karissāmi samāsena, nānāsattha samuddhaṭaṃ;</p>
<p class="gathalast" id="k7">Hitāya kavinaṃ nītiṃ, kavidappaṇanāmakaṃ.</p>
