<p class="bodytext my" id="k3">စတုတိံသတိမဝဂ္ဂပဉ္စတိံသတိမဝဂ္ဂဆတ္တိံသတိမဝဂ္ဂသတ္တတိံသတိမဝဂ္ဂအဋ္ဌတိံသတိမဝဂ္ဂါ <a class="pinfo M" id="M2.199" title="Myanmar-Vol 2-Page 199"> ¶ </a><a class="pinfo V" id="V2.195" title="VRI-Vol 2-Page 195"> ¶ </a> ဥတ္တာနတ္ထာယေဝ။</p>
<p class="bodytext my" id="k4">ဧကူနစတ္တာလီသမဝဂ္ဂေပိ ပဌမာပဒါနာဒီနိ အဋ္ဌမာပဒါနန္တာနိ ဥတ္တာနာနေဝါတိ။</p>
