<p class="chapter si" id="k1">යොගාවචරසම්පත්තිදීපනීගාථා</p>
<p class="hangnum si" id="k2"><a id="para3"></a><span class="paranum si">3</span>. </p>
<p class="gatha1 si" id="k3"> ජාතො යො නවමෙ ඛණෙ සුතධරො සීලෙන සුද්ධින්ද්රියො සංසාරං අයතො භවක්කයකරං දිස්වා සිවං ඛෙමතො,</p>
<p class="gathalast si" id="k4">තං සම්පාපකමග්ගදෙසකමුනිං සම්පූජයන්තො තතො උද්ධානුස්සතිභාවනාදිකමතො සම්පාදයෙ තං සිවං.</p>
