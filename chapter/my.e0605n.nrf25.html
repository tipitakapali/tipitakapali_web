<a id="toc0"></a>
<p class="chapter my" id="k1">ပါဋိဟာရိယဒီပနီဂါထာ</p>
<p class="hangnum my" id="k2"><a id="para175"></a><span class="paranum my">၁၇၅</span>။ </p>
<p class="gatha1 my" id="k3"> ဗြဟ္မဿ သဒ္ဒံ ကရဝီကဘာဏိံ၊</p>
<p class="gatha2 my" id="k4">ယထိစ္ဆိတံ သာဝယိတုံ သမတ္ထံ၊</p>
<p class="gatha3 my" id="k5">သစ္စံ ပိယံ ဘူတဟိတံ ဝဒန္တံ၊</p>
<p class="gathalast my" id="k6">န ပူဇယေ ကော ဟိ နရော သစေတနော။</p>
<p class="hangnum my" id="k7"><a id="para176"></a><span class="paranum my">၁၇၆</span>။ </p>
<p class="gatha1 my" id="k8"> ဣဒ္ဓိ စ အာဒေသနာနုသာသနီ၊</p>
<p class="gatha2 my" id="k9">ပါဋိဟီရေ ဘဂဝါ ဝသီ အဟု၊</p>
<p class="gatha3 my" id="k10">ကတွာန အစ္ဆေရသုပါဋိဟီရံ၊</p>
<p class="gathalast my" id="k11">ဒေသေသိ ဓမ္မံ အနုကမ္ပိမံ ပဇံ။</p>
