<p class="bodytext" id="k2"><a id="para191"></a><a id="para192"></a><a id="para193"></a><a id="para194"></a><a id="para195"></a><a id="para196"></a><a id="para197"></a><a id="para198"></a><a id="para199"></a><a id="para200"></a><a id="para191-200"></a><span class="paranum">191-200</span>.  Dukkhassa vaḍḍhi etesanti <b class="bld">dukkhavaḍḍhikā</b>. Ye hi dukkhaṃ vaḍḍhenti, punappunaṃ uppādenti, dukkhassa vaḍḍhi tesaṃ atthīti evaṃ vuttaṃ. <b class="bld">Sukhavaḍḍhikā</b>ti etthāpi eseva nayo.</p>
