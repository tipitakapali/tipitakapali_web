<p class="gatha1 thai" id="k5">อฏฺารสหิ <a class="pinfo P" id="P0.114" title="PTS-Vol 0-Page 114"> ¶ </a><a class="pinfo M" id="M0.1" title="Myanmar-Vol 0-Page 1"> ¶ </a><a class="pinfo V" id="V0.1" title="VRI-Vol 0-Page 1"> ¶ </a> เภเทหิ, วิภงฺคํ มารภฺชโน;</p>
<p class="gathalast thai" id="k6">เทสยิตฺวา มหาวีโร, ยํ ตสฺเสว อนนฺตรํ.</p>
<p class="gatha1 thai" id="k7">อเทสยิ ธาตุกถํ, ธาตุเภทปฺปกาสโน;</p>
<p class="gathalast thai" id="k8">ตสฺสตฺถํ ทีปยิสฺสามิ, ตํ สุณาถ สมาหิตาติ.</p>
