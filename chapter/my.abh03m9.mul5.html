<a id="toc1"></a>
<p class="title my" id="k2">၃၂-၄၃။ ဩဃာဒိဒုကာနိ</p>
<p class="bodytext my" id="k3"><a id="para1"></a><span class="paranum my">၁</span>။ ဩဃံ <a class="pinfo T" id="T3.347" title="Thai-Vol 3-Page 347"> ¶ </a><a class="pinfo V" id="V3.365" title="VRI-Vol 3-Page 365"> ¶ </a> ဓမ္မံ ပဋိစ္စ ဩဃော ဓမ္မော ဥပ္ပဇ္ဇတိ ဟေတုပစ္စယာ…ပေ…။</p>
<p class="bodytext my" id="k4"><a id="para2"></a><span class="paranum my">၂</span>။ ယောဂံ ဓမ္မံ ပဋိစ္စ ယောဂေါ ဓမ္မော ဥပ္ပဇ္ဇတိ ဟေတုပစ္စယာ…ပေ… (ဒွေပိ ဂေါစ္ဆကာ အာသဝဂေါစ္ဆကသဒိသာ နိန္နာနာကရဏာ)။</p>
<p class="centered my" id="k5">ဩဃယောဂဂေါစ္ဆကံ နိဋ္ဌိတံ။</p>
