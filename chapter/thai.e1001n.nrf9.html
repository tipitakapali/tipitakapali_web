<a id="toc0"></a>
<p class="chapter thai" id="k1">ทาสก กณฺฑ</p>
<p class="hangnum thai" id="k2"><a id="para292"></a><span class="paranum thai">๒๙๒</span>. </p>
<p class="gatha1 thai" id="k3"> อนฺโตชาโต <a class="pinfo M" id="M0.176" title="Myanmar-Vol 0-Page 176"> ¶ </a> ธนกฺกีโต, ทาสพฺโยปคโต สยํ;</p>
<p class="gathalast thai" id="k4">ทาสากรมรานีโต-จฺเจวํ เต จตุธา สิยุํ.</p>
<p class="hangnum thai" id="k5"><a id="para293"></a><span class="paranum thai">๒๙๓</span>. </p>
<p class="gatha1 thai" id="k6"> ปุพฺพุฏฺา ปจฺฉานิปาตี, ทินฺนสฺส อาทายีปิ จ;</p>
<p class="gathalast thai" id="k7">สุกตกมฺมกโร จ, กิตฺติวณฺณหโรปิ จ.</p>
<p class="hangnum thai" id="k8"><a id="para294"></a><span class="paranum thai">๒๙๔</span>. </p>
<p class="gatha1 thai" id="k9"> ทาสา ๐.๐๑๗๗ ปฺเจว โจรยฺย-สขาาตฺยตฺตสาทิสา;</p>
<p class="gathalast thai" id="k10">ตถา วิฺูหิ วิฺเยฺยา, มิตฺตทารา จ พนฺธวา.</p>
