<body>
  <div id="find-container" style="display: none;"><input type="text" id="find-input" placeholder="Find"> <span
      id="find-results"></span> <button id="find-previous" title="Previous Match">&#8593;</button> <button
      id="find-next" title="Next Match">&#8595;</button> <button id="find-close" title="Close Find">X</button></div>
  <div class="namo"><a class="aNoHover" href="index.html"><img width="50" height="50" src="web/icons/toplogo.webp"
        alt="Tipitakapali.org"></a></div>
  <div id="cst_name" style="text-align: center; font-weight: 800; margin-bottom: 8px;">Chaṭṭha Saṅgāyana Tipiṭaka
  </div>
  <div class="tableContainer"></div>
  <!-- cst ends now full text search and settings -->
  <div style="display: none;" class="sortandfilter" id="sortandfilter">
    <div id="gobackFromSearch" style="position: absolute;">
      <a id="gobackFromSearchLink" href="mula.html">
        <button class="smallButton" id="goBackButton"><img width="16" height="16" src="web/icons/toplogo.webp" alt="Tipitakapali.org" /> Go back</button>
      </a>
    </div>

    <div style="display: none;text-align:center;" id="fts_setting_toggle_button"><img width="40" height="40" src="web/icons/toplogo.webp" alt="Tipitakapali.org"/><br><button onclick="toggleFTSsetting()"><span style="color:#0e0e72;font-size:smaller;">▶ Show|Hide More Search Settings</span></button></div>

    <div id="fts_setting" class="hidenme">
      <br>
      <table class="tCenter">
        <tr>
          <td class="tLeft" colspan="4"><span class="greyText">Search Mode</span></td>
        </tr>
        <tr>
          <td class="tRight">
            <label class="form-switch" for="dts"><input title="fts settings" checked="checked" type="radio" id="dts"
                name="search_mode" value="dts"><i></i></label>
          </td>
          <td class="tLeft">Word distance</td>
          <td class="tRight">
            <label class="form-switch" for="fts"><input title="fts settings" type="radio" id="fts" name="search_mode"
                value="fts"><i></i></label>
          </td>
          <td class="tLeft">Exactly match</td>
        </tr>
        <tr></tr>
        <tr></tr>
        <tr>
          <td class="tRight">
            <label class="form-switch" for="sms"><input title="fts settings" type="radio" id="sms" name="search_mode"
                value="sms"><i></i></label>
          </td>
          <td class="tLeft">Simple match</td>
          <td class="tRight">
            <label class="form-switch" for="pfs"><input title="fts settings" type="radio" id="pfs" name="search_mode"
                value="pfs"><i></i></label>
          </td>
          <td class="tLeft">Prefix</td>
        </tr>
      </table>

      <table class="tCenter">
        <tr>
          <td class="tLeft">Word distance range</td>
          <td class="tLeft"><input title="fts settings" id="distance_n" name="distance_n" type="number" value="10"
              placeholder="Default: 10"></td>
        </tr>
        <tr>
          <td class="tLeft">Extract text length</td>
          <td class="tLeft"><input title="fts settings" id="snippet_len" name="snippet_len" type="number" value="40"
              placeholder="Default: 40"></td>
        </tr>
        <tr>
          <td class="tLeft">Max hit setting</td>
          <td class="tLeft"><input title="fts settings" id="hit_limit" name="hit_limit" type="number" value="100"
              max="1000" placeholder="Max: 1000"></td>
        </tr>
      </table>
      <hr
        style="height: 1px;border: none; background: linear-gradient(to right, transparent, #8b4513, transparent) !important; margin: 15px 0;">
    </div>
    <br><span style="font-weight:bold;">Sort by</span>
    <label class="circleRadio" for="rank"><input title="fts settings" checked="checked" type="radio" id="rank"
        name="res_sort" value="rank" onclick="updateSort()">
      Relevance</label>
    <label class="circleRadio" style="font-weight:lighter;" for="path"><input title="fts settings" type="radio"
        id="path" name="res_sort" value="path" onclick="updateSort()">
      Piṭaka</label>
    <label class="circleRadio" for="bm25"><input title="fts settings" type="radio" id="bm25" name="res_sort"
        value="bm25(pn)" onclick="updateSort()">
      BM25</label>
    <hr
      style="height: 1px;border: none; background: linear-gradient(to right, transparent, #8b4513, transparent) !important; margin: 15px 0;">
    <span
      style="padding:2px;font-size: normal; font-weight: bold; color:#0e0e72;">Filter
      results</span>

    <!-- sort and filter -->
    <div style="text-align: center; margin: 10px; font-size: normal;">
      <div>
        <label><input type="checkbox" id="filter-all-cat" checked onchange="toggleAllCategories()"> <b>All</b></label>
        <label><input type="checkbox" id="filter-mula" checked onchange="updateFilters()"> Mūla</label>
        <label><input type="checkbox" id="filter-attha" checked onchange="updateFilters()"> Aṭṭha</label>
        <label><input type="checkbox" id="filter-tika" checked onchange="updateFilters()"> Tīkā</label>
      <label><input type="checkbox" id="filter-anna" checked onchange="updateFilters()"> Añña</label>
      </div>
      <div style="margin-top: 10px;">
        <label><input type="checkbox" id="filter-all-type" checked onchange="toggleAllTypes()"> <b>All</b></label>
        <label><input type="checkbox" id="filter-vinaya" checked onchange="updateFilters()"> Vinaya</label>
        <label><input type="checkbox" id="filter-sutta" checked onchange="updateFilters()"> Sutta</label>
        <label><input type="checkbox" id="filter-abhidhamma" checked onchange="updateFilters()"> Abhidhamma</label>
        <label><input type="checkbox" id="filter-annatext" checked onchange="updateFilters()"> Añña(Text)</label>
      </div>
    </div>
  </div>
  <!-- sort and filter ends -->
  <div style="text-align:center;">
    <input title="fts settings"
      style="height: 25px; color: brown; font-size: large;font-style: normal;font-family: 'DejaVu Sans', 'Times New Roman', Times, serif;font-weight: bold;"
      name="search_words" oninput="ftsTyping('fts_input')" id="fts_input" type="text"
      placeholder="🔍 Full text search - accepts 17 pāḷi scripts" autofocus>
  </div>

  <div id="fts_results"></div>

  <div style="text-align:center;">
    <p style="display:block;color:midnightblue;" id="buildPaliScriptMenu">
      <label for="uSelectScript">Pāḷi display script</label>
      <select id="uSelectScript" name="uSelectScript">
        <option disabled="" value="">--Please choose an option--</option>
        <option value="si">Sinhala - සිංහල</option>
        <option value="my">Myanmar - ဗမာစာ</option>
        <option value="hi">Devanagari - हिन्दी</option>
        <option value="ro">Roman - Roman</option>
        <option value="thai">Thai - ไทย</option>
        <option value="laos">Laos - ລາວ</option>
        <option value="km">Khmer - ភាសាខ្មែរ</option>
        <option value="beng">Bengali - বাংলা</option>
        <option value="gurm">Gurmukhi - ਗੁਰਮੁਖੀ</option>
        <option value="guja">Gujarati - ગુજરાતી</option>
        <option value="telu">Telugu - తెలుగు</option>
        <option value="kann">Kannada - ಕನ್ನಡ</option>
        <option value="mala">Malayalam - മലയാളം</option>
        <option value="tham">Tai Tham - Tai Tham LN</option>
        <option value="brah">Brahmi - Brāhmī</option>
        <option value="tibt">Tibetan - བོད་སྐད།</option>
        <option value="cyrl">Cyrillic - кириллица</option>
      </select>
    </p>
  </div>

    <span> တိပိဋက ပါဠိ-မြန်မာအဘိဓာန်</span>

    <span id="themeIcon" style="color:#DAA520;" role="img" aria-label="sun">🌞</span>
