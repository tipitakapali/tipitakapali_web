<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Tipitaka Pali</title><meta http-equiv=refresh content="5; url='https://tipitakapali.org'"><style>body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    color: #333;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: 0 auto;
    text-align: center;
}

.error-image {
    width: 150px;
    height: 150px;
    margin-bottom: 20px;
}

.error-message {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 20px;
}

.redirect-message {
    font-size: 18px;
    margin-bottom: 20px;
}

.redirect-link {
    color: #333;
    text-decoration: none;
    transition: color 0.3s ease;
}

.redirect-link:hover {
    color: #daa520;
}

.loader-container {
top: 0;
left: 0;
display: flex;
justify-content: center;
align-items: center;
}

.loader {
/* adapted from https://css-loaders.com/spinner */
width: 50px;
aspect-ratio: 1;
color: #854f1d;
border-radius: 50%;
display: grid;
background: 
conic-gradient(from 90deg at 4px 4px,#0000 90deg,currentColor 0)
-4px -4px/calc(50% + 2px) calc(50% + 2px),
radial-gradient(farthest-side,currentColor 6px,#0000 7px calc(100% - 6px),currentColor calc(100% - 5px)) no-repeat;
animation: l10 2s infinite linear;
position: relative;
}
.loader:before {
content: "";
border-radius: inherit;
background: inherit;
transform: rotate(45deg);
}
@keyframes l10 {to{transform: rotate(.5turn)}}</style></head><body><div class=container><a class=aNoHover href=index.html><div class=loader-container><div class=loader></div></div></a><h1 class=error-message>Lost in Saṃsāra</h1><h3>404 Page Not Found</h3><p class=redirect-message>The page you are looking for doesn't exist. You will be redirected to the homepage in 5 seconds.</p><p class=redirect-link href=https://tipitakapali.org>Or click here to go to the homepage now.</p></div></body></html>
